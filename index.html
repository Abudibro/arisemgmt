  <body>
    <div id="root"></div>

    <!--
      Netlify Forms detection forms.
      Netlify scans raw HTML at build time to register form fields, so these
      can't be generated from the React app — keep field names in sync with
      src/components/Contact/formFields.ts by hand. Never shown to users.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden style="display:none">
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="brand" />
      <input name="sells" />
      <select name="budget"></select>
      <textarea name="msg"></textarea>
    </form>

    <form name="influencer" netlify netlify-honeypot="bot-field" hidden style="display:none">
      <input type="hidden" name="form-name" value="influencer" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="handle" />
      <input name="niche" />
      <select name="followers"></select>
      <input name="rate" />
      <input name="portfolio" />
      <textarea name="msg"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
