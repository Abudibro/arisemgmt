[build]
  command = "npm run build"
  publish = "dist"

# The roster page is linked from the nav but kept out of search results.
[[headers]]
  for = "/roster"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/roster/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
